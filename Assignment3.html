<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image</title>
  <style>
    .pur{
      background-color: mediumpurple;
      padding-top: 20px;
      padding-bottom: 60px;
      width: 600px;
      height: 400px;
      margin-left: 500px;
      margin-top: 50px;
    }
    .new{
      background-color: khaki;
      margin-right: 450px;
      padding: 2px;
      position: absolute;
      border-radius: 12px; 
      top: 85px;
      left: 580px;
    }
    .new p{
      margin: 0;
      font-weight: bold;
      font-size: 14px;
    }
    .image img{
      width: 420px;
      height: 200px;
      margin-left: 100px;
      border-radius: 12px;
    }
    .nov{
      background-color: white;
      width: 400px;
      margin-left: 100px;
      border-radius: 12px;
      padding-top: 30px;
      padding-bottom: 10px;
      padding-left: 10px;
      padding-right: 10px;
      margin-top: -20px;
    }
    .nov span{
      color: gray;
      font-size: 12px;
    }
    .nov p{
      font-size: 18px;
    }
  </style>
</head>
<body>    
   <div class="pur">
     <div class="new">
      <p>New and Improved</p>
     </div>
     <div class="image">
       <img src="pics/watch.png">
     </div>
     <div class="nov">
      <H2>Novus Watch <span>Series IV</span></H2>
      <p>
        The pinnacle of fashion and tech.This wearable
        piece is an homepage to gilded palaces and minimal
        regalia, combining nouveau-deco and brutalism influences
        in a compact,Swiss-made watch.
      </p>
     </div>
   </div>
</body>
</html>
